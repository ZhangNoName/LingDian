map $http_upgrade $lingdian_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        app.zsf.shopping
        merchant.zsf.shopping
        admin.zsf.shopping
        api.zsf.shopping;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.zsf.shopping;

    ssl_certificate /etc/letsencrypt/live/app.zsf.shopping/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zsf.shopping/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name merchant.zsf.shopping;

    ssl_certificate /etc/letsencrypt/live/app.zsf.shopping/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zsf.shopping/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.zsf.shopping;

    ssl_certificate /etc/letsencrypt/live/app.zsf.shopping/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zsf.shopping/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.zsf.shopping;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/app.zsf.shopping/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zsf.shopping/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lingdian_connection_upgrade;
    }
}
