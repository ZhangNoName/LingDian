name: Deploy LingDian

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated app,merchant,admin,api or all
        required: true
        default: all

concurrency:
  group: lingdian-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:deployment
      - run: pnpm run build
      - run: pnpm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: targets
        env:
          MANUAL_TARGETS: ${{ inputs.targets }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$MANUAL_TARGETS" ]; then
            echo "value=$MANUAL_TARGETS" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" | node scripts/print-deployment-targets.mjs >> "$GITHUB_OUTPUT"
            else
              echo "value=all" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Bundle verified revision
        if: steps.targets.outputs.value != 'none'
        run: |
          git branch deployment-bundle "${{ github.sha }}"
          git bundle create lingdian-deploy.bundle deployment-bundle
      - uses: appleboy/scp-action@v1
        if: steps.targets.outputs.value != 'none'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: lingdian-deploy.bundle
          target: /home/lighthouse/apps
      - uses: appleboy/ssh-action@v1.2.2
        if: steps.targets.outputs.value != 'none'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            git -C /home/lighthouse/apps/lingdian fetch /home/lighthouse/apps/lingdian-deploy.bundle deployment-bundle
            rm -f /home/lighthouse/apps/lingdian-deploy.bundle
            release_script=$(mktemp /tmp/lingdian-release.XXXXXX)
            trap 'rm -f "$release_script"' EXIT
            git -C /home/lighthouse/apps/lingdian show '${{ github.sha }}:deploy/scripts/release.sh' > "$release_script"
            LINGDIAN_SYNC_NGINX=1 bash "$release_script" '${{ github.sha }}' '${{ steps.targets.outputs.value }}'
